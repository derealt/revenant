[package]
name = "revenant"
version = "0.1.0"
edition = "2021"
description = "Invisible daemon that captures cognitive context and restores it as ghost annotations"
license = "MIT"

[[bin]]
name = "revenant"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
notify = { version = "6", features = ["macos_fsevent"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
glob = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"], optional = true }
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
tokio-stream = "0.1"
async-trait = "0.1"
ignore = "0.4"  # .gitignore-aware file walking

[features]
default = []
llm-api = ["reqwest"]

[[bin]]
name = "rvn"
path = "src/cli.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
