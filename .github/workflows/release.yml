name: Release

# Push a tag like v0.3.0 and this builds every download the installer and the
# README point at, then publishes them on the GitHub release for that tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.3.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  daemon:
    name: daemon (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin, name: darwin-aarch64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, name: darwin-x86_64 }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --manifest-path daemon/Cargo.toml
      - name: Build
        run: cargo build --release --manifest-path daemon/Cargo.toml --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          version="${TAG#v}"
          mkdir -p out
          tar -czf "out/revenant-${version}-${{ matrix.name }}.tar.gz" \
            -C "daemon/target/${{ matrix.target }}/release" revenant rvn
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.name }}
          path: out/*

  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chrome extension
        working-directory: ghosts/browser
        run: |
          npm ci
          npm run package
          mkdir -p ../../out
          (cd dist && zip -r "../../../out/revenant-chrome-extension-${TAG#v}.zip" .)
      - name: VS Code / Cursor extension
        working-directory: ghosts/vscode
        run: |
          npm ci
          npm run build
          npx --yes @vscode/vsce package --out "../../out/revenant-ghost-${TAG#v}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: out/*

  publish:
    needs: [daemon, extensions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" \
              --title "REVENANT $TAG" --generate-notes
          fi
