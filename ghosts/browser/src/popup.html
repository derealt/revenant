<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      min-height: 120px;
      background: #14141a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #4EC9B0;
    }
    .no-ghost {
      color: rgba(255,255,255,0.4);
      font-style: italic;
      padding: 8px 0;
    }
    .card {
      padding: 8px 0;
    }
    .card-project {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.5);
      margin-bottom: 4px;
    }
    .card-summary {
      color: #e0e0e0;
      line-height: 1.5;
      margin-bottom: 6px;
    }
    .card-next {
      color: #FFC864;
      font-style: italic;
      font-size: 12px;
    }
    .setup {
      color: rgba(255,255,255,0.75);
      line-height: 1.5;
      padding: 4px 0;
    }
    .setup a {
      color: #4EC9B0;
    }
    .dismiss-btn {
      margin-top: 12px;
      width: 100%;
      padding: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      font-size: 12px;
    }
    .dismiss-btn:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size:16px">&#x1F47B;</span>
    <h1>REVENANT</h1>
  </div>
  <div id="content">
    <div class="no-ghost">Checking for Revenant on this computer...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
